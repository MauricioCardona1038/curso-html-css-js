<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos de Formularios</title>
</head>
<body>
    <!-- Campos de Formularios -->
    <form action="procesar_formulario.php" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo"required>
        <br><br>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required><br><br>
        
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br><br>

        <label for="mayoredad">¿Eres mayor de edad?</label>
        <input type="radio" id="si" name="mayoredad" value="si">
        <label for="si">Sí</label>
        <input type="radio" id="no" name="mayoredad" value="no">
        <label for="no">No</label>
        <br><br>

        <label for="intereses">Selecciona tus Intereses:</label>
        <input type="checkbox" id="deportes" name="intereses" value="deportes">
        <label for="deportes">Deportes</label>
        <input type="checkbox" id="musica" name="intereses" value="musica">
        <label for="musica">Música</label>
        <input type="checkbox" id="cine" name="intereses" value="cine">
        <label for="cine">Cine</label><br><br>

        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea><br><br>

        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="mexico">México</option>
            <option value="espana">España</option>
            <option value="argentina">Argentina</option>
            <option value="colombia">Colombia</option>
        </select><br><br>

        <label for="archivo">Subir Archivo:</label>
        <input type="file" id="archivo" name="archivo" multiple><br><br>

        <label for="color">Selecciona un Color:</label>
        <input type="color" id="color" name="color"><br><br>

        <label for="rango">Selecciona un Rango:</label>
        <input type="range" id="rango" name="rango" min="0" max="100"><br><br>

        <label for="url">Sitio Web:</label>
        <input type="url" id="url" name="url"><br><br>  

        <input type="hidden" name="token" value="1234567890abcdef"><br><br>


        <input type="submit" value="Enviar">
        
        <input type="reset" value="Restablecer">
</body>
</html>
