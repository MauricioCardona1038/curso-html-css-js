<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline</title>
</head>
<body>
    <!-- Ejemplo de elementos en block -->
    <div>
        <p>Este es un párrafo dentro de un div.</p>
    </div>
    <div>
        <h2>Este es un título dentro de un div.</h2>
    </div>

    <!-- Ejemplo de elementos en inline -->
    <span>Este es un texto en línea.</span>
    <span>Este también es un texto en línea.</span>
    
</body>
</html>
