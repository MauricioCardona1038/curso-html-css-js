<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subindices, superindices y citas</title>
</head>
<body>
    <!--subíndices-->
    H<sub>2</sub>O
    <br>
    CO<sub>2</sub>
    <br>
    X<sub>1</sub>, X<sub>2</sub>, X<sub>3</sub>

    <!--Superíndices-->
    <br>
    2<sup>3</sup>
    <br>
    E=mc<sup>2</sup>

    <!--Citas-->
    <br>
    <blockquote>
        <p>El conocimiento es poder</p>
        <footer>-Sir Francis Bacon</footer>
    </blockquote>


</body>
</html>
