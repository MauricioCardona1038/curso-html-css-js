<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto preformateado, codigo y resaltado</title>
</head>
<body>
    <!-- Texto preformateado-->
     Esto
     es 
     texto
     en 
     varios
     renglones

     <pre>
     Esto
     es 
     texto
     en 
     varios
     renglones
     </pre>

     <!--Código-->

     <p> Para imprimir hola mundo en el lenguaje de programacion python</p>
     <code>
        print("Hola mundo")
     </code>
     <p>este codigo muestra el mensaje "Hola, mundo"</p>

     <!--Resaltado-->
     El término <mark>destacado</mark> se resalta en este texto
</body>
</html>
