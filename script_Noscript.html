<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script y Noscript</title>
</head>
<body>
    <!-- Ejemplo de uso de script -->
    <script>
        document.write("<p>Este párrafo fue generado por JavaScript.</p>");
    </script>

    <!-- Ejemplo de uso de noscript -->
    <noscript>
        <p>JavaScript está deshabilitado en tu navegador. Este contenido se muestra porque no se puede ejecutar el script.</p>
    </noscript>
</body>
</html>
